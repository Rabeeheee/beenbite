version: '3.9'

services:
  # ============================================
  # Infrastructure Services
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: beenbite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: beenbite_admin
      POSTGRES_PASSWORD: beenbite_secure_password
      POSTGRES_MULTIPLE_DATABASES: beenbite_auth,beenbite_users,beenbite_companies,beenbite_subscriptions,beenbite_payments,beenbite_rewards,beenbite_master,beenbite_notifications
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U beenbite_admin']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: beenbite-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: beenbite-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Application Services
  # ============================================
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: beenbite-gateway
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - GATEWAY_PORT=3000
    depends_on:
      - redis
      - auth-service
    networks:
      - beenbite-network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: beenbite-auth
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - AUTH_SERVICE_PORT=3001
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - beenbite-network

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: beenbite-user
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      - NODE_ENV=production
      - USER_SERVICE_PORT=3002
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beenbite-network

  company-service:
    build:
      context: ./services/company-service
      dockerfile: Dockerfile
    container_name: beenbite-company
    restart: unless-stopped
    ports:
      - '3003:3003'
    environment:
      - NODE_ENV=production
      - COMPANY_SERVICE_PORT=3003
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beenbite-network

  subscription-service:
    build:
      context: ./services/subscription-service
      dockerfile: Dockerfile
    container_name: beenbite-subscription
    restart: unless-stopped
    ports:
      - '3004:3004'
    environment:
      - NODE_ENV=production
      - SUBSCRIPTION_SERVICE_PORT=3004
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beenbite-network

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: beenbite-payment
    restart: unless-stopped
    ports:
      - '3005:3005'
    environment:
      - NODE_ENV=production
      - PAYMENT_SERVICE_PORT=3005
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beenbite-network

  reward-service:
    build:
      context: ./services/reward-service
      dockerfile: Dockerfile
    container_name: beenbite-reward
    restart: unless-stopped
    ports:
      - '3006:3006'
    environment:
      - NODE_ENV=production
      - REWARD_SERVICE_PORT=3006
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beenbite-network

  master-data-service:
    build:
      context: ./services/master-data-service
      dockerfile: Dockerfile
    container_name: beenbite-master
    restart: unless-stopped
    ports:
      - '3007:3007'
    environment:
      - NODE_ENV=production
      - MASTER_DATA_SERVICE_PORT=3007
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beenbite-network

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: beenbite-notification
    restart: unless-stopped
    ports:
      - '3008:3008'
    environment:
      - NODE_ENV=production
      - NOTIFICATION_SERVICE_PORT=3008
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - beenbite-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: beenbite-frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - api-gateway
    networks:
      - beenbite-network

networks:
  beenbite-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
